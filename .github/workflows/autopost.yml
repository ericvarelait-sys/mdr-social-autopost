name: Publicar contenido programado (IG + FB)

on:
  schedule:
    # Despierta ~25 min antes de cada fecha/hora exacta y espera en el servidor hasta la hora exacta
    - cron: "5 21 20 11 *"  # H01 (story) -> 20/11 18:30 ART
    - cron: "35 13 21 11 *"  # M02 (post) -> 21/11 11:00 ART
    - cron: "35 22 22 11 *"  # H02 (story) -> 22/11 20:00 ART
    - cron: "5 15 23 11 *"  # M03 (post) -> 23/11 12:30 ART
    - cron: "5 21 24 11 *"  # H03 (story) -> 24/11 18:30 ART
    - cron: "5 21 25 11 *"  # M04 (post) -> 25/11 18:30 ART
    - cron: "5 15 26 11 *"  # H04 (story) -> 26/11 12:30 ART
    - cron: "5 22 27 11 *"  # H05 (story) -> 27/11 19:30 ART
    - cron: "5 13 28 11 *"  # M05 (post) -> 28/11 10:30 ART
    - cron: "35 22 29 11 *"  # H06 (story) -> 29/11 20:00 ART
    - cron: "5 23 30 11 *"  # M06 (post) -> 30/11 20:30 ART
    - cron: "5 21 1 12 *"  # H07 (story) -> 01/12 18:30 ART
    - cron: "35 15 2 12 *"  # M07 (post) -> 02/12 13:00 ART
    - cron: "5 15 3 12 *"  # H08 (story) -> 03/12 12:30 ART
    - cron: "35 21 4 12 *"  # H09 (story) -> 04/12 19:00 ART
    - cron: "35 13 5 12 *"  # M08 (post) -> 05/12 11:00 ART
    - cron: "35 22 6 12 *"  # H10 (story) -> 06/12 20:00 ART
    - cron: "5 15 7 12 *"  # H11 (story) -> 07/12 12:30 ART
    - cron: "35 13 8 12 *"  # M09 (post) -> 08/12 11:00 ART
    - cron: "35 22 9 12 *"  # H12 (story) -> 09/12 20:00 ART
    - cron: "5 21 10 12 *"  # M10 (post) -> 10/12 18:30 ART
    - cron: "35 15 11 12 *"  # H13 (story) -> 11/12 13:00 ART
    - cron: "5 23 12 12 *"  # M11 (post) -> 12/12 20:30 ART
    - cron: "5 22 13 12 *"  # H14 (story) -> 13/12 19:30 ART
    - cron: "20 15 14 12 *"  # M12 (post) -> 14/12 12:45 ART
    - cron: "5 21 15 12 *"  # H15 (story) -> 15/12 18:30 ART
    - cron: "5 23 16 12 *"  # M13 (post) -> 16/12 20:30 ART
    - cron: "5 15 17 12 *"  # H16 (story) -> 17/12 12:30 ART
    - cron: "5 21 17 12 *"  # M14 (post) -> 17/12 18:30 ART
    - cron: "17 1 * * *"  # Respaldo diario 22:17 ART por si GitHub atraso algun turno
  workflow_dispatch:
    inputs:
      force_id:
        description: "Opcional: ID especifico a publicar ahora (ej. M02 o H01)"
        required: false
        default: ""
      dry_run:
        description: "Solo verificar sin publicar (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Meta Graph API Publisher
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --check"
          fi
          if [ -n "${{ github.event.inputs.force_id }}" ]; then
            ARGS="$ARGS --force-id ${{ github.event.inputs.force_id }}"
          fi
          python scripts/publish.py $ARGS

      - name: Commit updated state.json
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "mdr-autopost-bot"
          git config user.email "bot@mdr.local"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update published state [skip ci]"
            git push
          fi
